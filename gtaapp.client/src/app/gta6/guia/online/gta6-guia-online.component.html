<div class="wiki-shell gta6-theme" [class.mode-day]="themeMode === 'day'">
  <!-- BARRA DE NAVEGACIÓN SUPERIOR HUD -->
  <nav class="wiki-top-nav">
    <div class="nav-container">
      <div class="nav-left">
        <!-- BOTÓN HAMBURGUESA MÓVIL (a la izquierda en móvil, oculto en PC) -->
        <button
          type="button"
          class="mobile-nav-toggle-btn"
          (click)="toggleMobileNav()"
          [title]="mobileNavOpen ? 'Cerrar menú' : 'Abrir menú de navegación'"
          aria-label="Menú de navegación"
        >
          <i class="fa-solid" [ngClass]="mobileNavOpen ? 'fa-xmark' : 'fa-bars'"></i>
        </button>

        <!-- Separador vertical espigado izquierdo -->
        <span class="nav-spike-divider" aria-hidden="true"></span>

        <!-- LOGO DE LA HOME CON TAMAÑO FIJADO -->
        <a routerLink="/home" class="wiki-logo-link" title="Ir a Inicio">
          <img src="assets/images/logos/logoJMD.png" alt="Logo GTA MAPS" class="wiki-nav-logo" width="120" height="38" />
        </a>

        <!-- Separador vertical espigado derecho -->
        <span class="nav-spike-divider" aria-hidden="true"></span>

        <div class="nav-brand">
          <span class="nav-brand-title">GTA WORLD</span>
        </div>

        <!-- Separador -->
        <span class="nav-spike-divider" aria-hidden="true"></span>

        <a routerLink="/home" class="nav-link-item" title="Ir al Inicio">
          <i class="fa-solid fa-house"></i>
          <span>INICIO</span>
        </a>

        <span class="nav-spike-divider" aria-hidden="true"></span>

        <a routerLink="/gta5" class="nav-link-item" title="Ir al Mapa de GTA 5">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>GTA 5 MAP</span>
        </a>

        <span class="nav-spike-divider" aria-hidden="true"></span>

        <a
          [routerLink]="isDevAllowed ? '/gta6' : null"
          class="nav-link-item"
          [class.nav-link-disabled]="!isDevAllowed"
          (click)="onGta6MapClick($event)"
          [title]="!isDevAllowed ? 'Mapa GTA VI (Próximamente)' : 'Ir al Mapa de GTA 6'"
        >
          <i class="fa-solid" [ngClass]="isDevAllowed ? 'fa-map-location-dot' : 'fa-lock'"></i>
          <span>GTA 6 MAP</span>
        </a>

        <span class="nav-spike-divider" aria-hidden="true"></span>

        <a routerLink="/gta5-guia-offline" class="nav-link-item" title="Ir a la Guía de GTA 5">
          <i class="fa-solid fa-book-open"></i>
          <span>GUIA GTA 5</span>
        </a>

        <span class="nav-spike-divider" aria-hidden="true"></span>

        <div class="mode-switch-track" aria-label="Cambiar entre guía Historia y guía Online">
          <a class="mode-switch-btn mode-historia" routerLink="/gta6-guia-offline" title="Guía GTA 6 Historia">
            <i class="mode-indicator dot-historia"></i>
            <span class="mode-text-desktop">HISTORIA</span>
            <span class="mode-text-mobile">HISTORIA</span>
          </a>
          <a class="mode-switch-btn mode-online is-active" routerLink="/gta6-guia-online" title="Guía GTA 6 Online">
            <i class="mode-indicator dot-online"></i>
            <span class="mode-text-desktop">ONLINE</span>
            <span class="mode-text-mobile">ONLINE</span>
          </a>
        </div>

        <span class="nav-spike-divider" aria-hidden="true"></span>
      </div>

      <div class="nav-right">
        <button
          type="button"
          class="theme-toggle-switch"
          [class.is-day]="themeMode === 'day'"
          (click)="toggleThemeMode()"
          [title]="themeMode === 'night' ? 'Cambiar a Modo Día' : 'Cambiar a Modo Noche'"
          aria-label="Cambiar entre modo día y noche"
        >
          <span class="switch-icon switch-icon-moon">🌙</span>
          <span class="switch-icon switch-icon-sun">☀️</span>
          <span class="switch-thumb"></span>
        </button>
      </div>
    </div>

    <!-- MENÚ DESPLEGABLE MÓVIL (DRAWER) -->
    <div class="mobile-nav-drawer" *ngIf="mobileNavOpen">
      <div class="mobile-nav-links">
        <a routerLink="/home" class="mobile-nav-link" (click)="closeMobileNav()">
          <i class="fa-solid fa-house"></i>
          <span>INICIO</span>
        </a>
        <a routerLink="/gta5" class="mobile-nav-link" (click)="closeMobileNav()">
          <i class="fa-solid fa-map-location-dot"></i>
          <span>GTA 5 MAP</span>
        </a>
        <a
          [routerLink]="isDevAllowed ? '/gta6' : null"
          class="mobile-nav-link"
          [class.nav-link-disabled]="!isDevAllowed"
          (click)="onGta6MapClick($event); closeMobileNav()"
        >
          <i class="fa-solid" [ngClass]="isDevAllowed ? 'fa-map-location-dot' : 'fa-lock'"></i>
          <span>GTA 6 MAP</span>
        </a>
        <a routerLink="/gta5-guia-offline" class="mobile-nav-link" (click)="closeMobileNav()">
          <i class="fa-solid fa-book-open"></i>
          <span>GUIA GTA 5</span>
        </a>
        <a routerLink="/gta6-noticias" class="mobile-nav-link" (click)="closeMobileNav()">
          <i class="fa-solid fa-newspaper"></i>
          <span>NOTICIAS</span>
        </a>
      </div>

      <!-- Selector de modo Historia / Online en móvil -->
      <div class="mobile-mode-switcher">
        <span class="mobile-mode-label">MODO:</span>
        <div class="mode-switch-track">
          <a class="mode-switch-btn mode-historia" routerLink="/gta6-guia-offline" (click)="closeMobileNav()">
            <i class="mode-indicator dot-historia"></i>
            <span>HISTORIA</span>
          </a>
          <a class="mode-switch-btn mode-online is-active" routerLink="/gta6-guia-online" (click)="closeMobileNav()">
            <i class="mode-indicator dot-online"></i>
            <span>ONLINE</span>
          </a>
        </div>
      </div>
    </div>
  </nav>

  <section class="gta6-online-guide-content" aria-labelledby="gta6-online-guide-title">
    <p class="gta6-online-guide-kicker">GTA VI · ONLINE</p>
    <h1 id="gta6-online-guide-title">GUÍA GTA 6 ONLINE</h1>
    <p>Esta sección queda preparada para incorporar la guía específica de GTA 6 Online.</p>
  </section>
</div>

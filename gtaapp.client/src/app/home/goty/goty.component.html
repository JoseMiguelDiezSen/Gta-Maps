@if (gotyService.isEnabled) {
<div class="goty-wrapper" [class.is-open]="isOpen" [class.is-dragging]="isDragging" [style.top.px]="wrapperTop" [style.left.px]="wrapperLeft">

  <!-- BOTÓN FLOTANTE AVATAR (Arrastrable y Clickable) -->
  <button
    type="button"
    class="goty-floating-avatar"
    [class.is-active]="isOpen"
    (mousedown)="onDragStart($event)"
    (touchstart)="onDragStart($event)"
    (click)="onAvatarClick($event)"
    [title]="talkTooltip"
    [attr.aria-label]="talkTooltip"
  >
    <div class="goty-avatar-ring"></div>
    <img [src]="avatarSrc" [alt]="botName" class="goty-avatar-img" width="50" height="50" loading="lazy" decoding="async" />
  </button>

  <!-- VENTANA POPUP DE CHAT -->
  @if (isOpen) {
  <div class="goty-chat-card">
    <!-- Cabecera -->
    <div class="goty-chat-header" (mousedown)="onDragStart($event)" (touchstart)="onDragStart($event)">
      <div class="goty-header-left">
        <img [src]="avatarSrc" [alt]="botName" class="goty-header-avatar" width="32" height="32" loading="lazy" decoding="async" />
        <div class="goty-header-info">
          <span class="goty-bot-title">{{ botName }}</span>
        </div>
      </div>
      <button type="button" class="goty-close-btn" (click)="closeChat()" [title]="closeTooltip" [attr.aria-label]="closeTooltip">
        ✕
      </button>
    </div>

    <!-- Cuerpo de mensajes con autoscroll -->
    <div class="goty-chat-body" #scrollContainer>
      @for (msg of messages; track msg.id) {
      <div
        class="goty-msg-row"
        [class.is-user]="msg.sender === 'user'"
        [class.is-bot]="msg.sender === 'goty'"
      >
        <div class="goty-msg-bubble">
          @if (msg.sender === 'user') {
            <div class="goty-msg-text">{{ msg.text }}</div>
          } @else if (msg.sender === 'goty') {
            <div class="goty-msg-text" [innerHTML]="formatMarkdown(msg.text)"></div>
          }
        </div>
      </div>
      }
    </div>
  </div>
  }

</div>
}

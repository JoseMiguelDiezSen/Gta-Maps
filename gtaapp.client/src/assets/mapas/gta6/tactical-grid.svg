<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 1350" width="2400" height="1350">
  <defs>
    <radialGradient id="tacticalBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c121d"/>
      <stop offset="60%" stop-color="#070b12"/>
      <stop offset="100%" stop-color="#03060a"/>
    </radialGradient>

    <pattern id="gridFine" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(0, 240, 255, 0.035)" stroke-width="1"/>
      <circle cx="0" cy="0" r="0.8" fill="rgba(0, 240, 255, 0.12)"/>
    </pattern>

    <filter id="glowPink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowAmber" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="2400" height="1350" fill="url(#tacticalBg)"/>
  <rect width="2400" height="1350" fill="url(#gridFine)"/>

  <g class="radar-lines" fill="none">
    <circle cx="1200" cy="675" r="320" stroke="rgba(0, 240, 255, 0.08)" stroke-width="1.2" stroke-dasharray="6 6"/>
    <circle cx="1200" cy="675" r="620" stroke="rgba(255, 79, 224, 0.07)" stroke-width="1.2" stroke-dasharray="10 8"/>
    <circle cx="1200" cy="675" r="950" stroke="rgba(0, 240, 255, 0.05)" stroke-width="1" stroke-dasharray="12 10"/>

    <path d="M 680,240 A 620 620 0 0 1 1720,240" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.8" stroke-dasharray="8 6"/>
    <path d="M 1720,1110 A 620 620 0 0 1 680,1110" stroke="rgba(255, 79, 224, 0.12)" stroke-width="1.8" stroke-dasharray="8 6"/>

    <line x1="80" y1="675" x2="2320" y2="675" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.2" stroke-dasharray="4 6"/>
    <line x1="1200" y1="60" x2="1200" y2="1290" stroke="rgba(0, 240, 255, 0.12)" stroke-width="1.2" stroke-dasharray="4 6"/>

    <circle cx="1200" cy="675" r="38" stroke="#ff4fe0" stroke-width="2.5" filter="url(#glowPink)"/>
    <line x1="1145" y1="675" x2="1255" y2="675" stroke="#ff4fe0" stroke-width="2"/>
    <line x1="1200" y1="620" x2="1200" y2="730" stroke="#ff4fe0" stroke-width="2"/>
  </g>

  <g class="zone-ambrosia">
    <polygon points="850,110 1520,110 1560,450 890,450"
             fill="rgba(245, 158, 11, 0.04)"
             stroke="#f59e0b"
             stroke-width="1.8"
             stroke-dasharray="7 5"
             filter="url(#glowAmber)"/>

    <g transform="translate(1200, 260)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" user-select="none">
      <text y="0" fill="#f59e0b" font-size="28" font-weight="900" letter-spacing="4">AMBROSIA</text>
      <text y="28" fill="#fbbf24" font-size="11.5" font-weight="800" letter-spacing="2">ZONA INDUSTRIAL Y REFINERIAS</text>
    </g>
  </g>

  <g class="zone-port-gellhorn">
    <polygon points="280,480 790,440 850,1050 340,1090"
             fill="rgba(56, 189, 248, 0.04)"
             stroke="#38bdf8"
             stroke-width="1.8"
             stroke-dasharray="7 5"
             filter="url(#glowCyan)"/>

    <g transform="translate(560, 750)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" user-select="none">
      <text y="0" fill="#38bdf8" font-size="28" font-weight="900" letter-spacing="4">PORT GELLHORN</text>
      <text y="28" fill="#7dd3fc" font-size="11.5" font-weight="800" letter-spacing="2">PUERTO COMERCIAL, TALLERES Y CIRCUITO</text>
    </g>
  </g>

  <g class="zone-lake-leonida">
    <ellipse cx="1130" cy="800" rx="270" ry="140"
             fill="rgba(6, 182, 212, 0.06)"
             stroke="#06b6d4"
             stroke-width="1.8"
             stroke-dasharray="7 5"
             filter="url(#glowCyan)"/>

    <g transform="translate(1130, 790)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" user-select="none">
      <text y="0" fill="#06b6d4" font-size="24" font-weight="900" letter-spacing="4">LAKE LEONIDA</text>
      <text y="26" fill="#67e8f9" font-size="11" font-weight="800" letter-spacing="2">CUENCA CENTRAL DE AGUA DULCE</text>
    </g>
  </g>

  <g class="zone-vice-city">
    <polygon points="1600,280 2240,280 2280,1040 1560,1040"
             fill="rgba(255, 79, 224, 0.04)"
             stroke="#ff4fe0"
             stroke-width="2"
             stroke-dasharray="8 6"
             filter="url(#glowPink)"/>

    <g transform="translate(1910, 560)" font-family="system-ui, -apple-system, sans-serif" text-anchor="middle" user-select="none">
      <text y="0" fill="#ff4fe0" font-size="34" font-weight="900" letter-spacing="6">VICE CITY</text>
      <text y="32" fill="#f472b6" font-size="12" font-weight="800" letter-spacing="2">DOWNTOWN // METROPOLIS PRINCIPAL</text>
    </g>

    <g transform="translate(1720, 420)" font-family="system-ui, sans-serif">
      <rect x="-65" y="-14" width="130" height="28" rx="5" fill="rgba(14, 116, 144, 0.75)" stroke="#06b6d4" stroke-width="1.2"/>
      <text x="0" y="4" fill="#a5f3fc" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">LITTLE HAITI</text>
    </g>

    <g transform="translate(2130, 640)" font-family="system-ui, sans-serif">
      <rect x="-65" y="-14" width="130" height="28" rx="5" fill="rgba(157, 23, 77, 0.75)" stroke="#f43f5e" stroke-width="1.2"/>
      <text x="0" y="4" fill="#fecdd3" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">VICE BEACH</text>
    </g>

    <g transform="translate(1900, 860)" font-family="system-ui, sans-serif">
      <rect x="-85" y="-14" width="170" height="28" rx="5" fill="rgba(30, 41, 59, 0.85)" stroke="#64748b" stroke-width="1.2"/>
      <text x="0" y="4" fill="#e2e8f0" font-size="11" font-weight="900" letter-spacing="1.5" text-anchor="middle">PORT OF VICE CITY</text>
    </g>
  </g>

  <g class="zone-grassrivers">
    <polygon points="760,1010 1500,1010 1460,1270 800,1270"
             fill="rgba(34, 197, 94, 0.03)"
             stroke="#22c55e"
             stroke-width="1.6"
             stroke-dasharray="6 4"/>
  </g>
</svg>
